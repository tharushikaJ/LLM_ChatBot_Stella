<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink AI Assistant</title>


<style>


*{
    box-sizing:border-box;
    font-family:"Poppins", Arial, sans-serif;
}



body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

    linear-gradient(
        135deg,
        #ffd6e7,
        #ffeaf2,
        #f8d7ff
    );

}



/* Main chatbot box */

.chat-container{


    width:420px;

    height:650px;

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(15px);

    border-radius:30px;

    box-shadow:

    0 20px 40px rgba(255,120,160,0.25);

    overflow:hidden;

    display:flex;

    flex-direction:column;


}



/* Header */


.header{


    padding:25px;

    background:

    linear-gradient(
        135deg,
        #ff9fc5,
        #ffb6d9
    );


    color:white;

    text-align:center;

}



.header h1{

    margin:0;

    font-size:24px;

}


.header p{

    margin-top:8px;

    font-size:13px;

}



/* Chat area */


#chat{


    flex:1;

    padding:20px;

    overflow-y:auto;


}




.message{


    max-width:75%;

    padding:12px 16px;

    margin:12px 0;

    border-radius:20px;

    font-size:15px;

    line-height:1.5;

}



/* User message */


.user{


    margin-left:auto;

    background:#ff8fbd;

    color:white;

    border-bottom-right-radius:5px;

}



/* Bot message */


.bot{


    margin-right:auto;

    background:#ffffff;

    color:#555;

    border-bottom-left-radius:5px;

    box-shadow:0 5px 15px rgba(0,0,0,0.05);


}



/* Input area */


.input-area{


    display:flex;

    padding:15px;

    background:white;


}



input{


    flex:1;

    border:none;

    outline:none;

    padding:14px;

    border-radius:25px;

    background:#ffeaf2;

    font-size:14px;


}



button{


    margin-left:10px;

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;


    background:#ff8fbd;

    color:white;

    font-size:20px;

    cursor:pointer;


}



button:hover{


    background:#ff6fa8;

}



</style>


</head>



<body>



<div class="chat-container">


<div class="header">


<h1>🌸 Stella AI</h1>

<p>Your personal AI companion ✨</p>


</div>




<div id="chat">


<div class="message bot">

Hi 💗 I'm Stella. How can I help you today?

</div>


</div>





<div class="input-area">


<input

id="input"

placeholder="Ask me anything..."

>


<button onclick="sendMessage()">

➤

</button>


</div>



</div>





<script>


let history=[];



const input=document.getElementById("input");

const chat=document.getElementById("chat");



function addMessage(type,text){


let div=document.createElement("div");


div.className="message "+type;


div.innerHTML=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}





async function sendMessage(){



let text=input.value;



if(text.trim()=="") return;



addMessage("user",text);



history.push({

role:"user",

content:text

});



input.value="";



/*

Backend connection

*/

let response=await fetch("/chat",{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

messages:history

})


});



let data=await response.json();



addMessage("bot",data.reply);



history.push({

role:"assistant",

content:data.reply

});



}




</script>




</body>


</html>
